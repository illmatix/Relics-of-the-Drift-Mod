name: Label Issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        with:
          script: |
            const title = (process.env.ISSUE_TITLE || '').toLowerCase();
            const body = (process.env.ISSUE_BODY || '').toLowerCase();
            const text = `${title} ${body}`;
            const labels = [];

            const rules = [
              { keywords: ['bug', 'crash', 'error', 'broken', 'fix'], label: 'bug' },
              { keywords: ['feature', 'add', 'new', 'implement', 'request'], label: 'feature' },
              { keywords: ['enhance', 'improve', 'update', 'upgrade'], label: 'enhancement' },
              { keywords: ['doc', 'readme', 'documentation', 'typo'], label: 'documentation' },
              { keywords: ['refactor', 'cleanup', 'restructure'], label: 'refactor' },
              { keywords: ['config', 'configuration', 'toggle', 'setting'], label: 'config' },
              { keywords: ['relic', 'ring', 'bracelet', 'trinket', 'amulet', 'slot', 'equip', 'unequip'], label: 'relics' },
              { keywords: ['affix', 'prefix', 'suffix', 'roll', 'modifier', 'stat'], label: 'affixes' },
              { keywords: ['lectern', 'identify', 'identification', 'decipher', 'research', 'scholar'], label: 'lectern' },
              { keywords: ['scramble', 'scrambled', 'glyph', 'unidentified', 'gibberish'], label: 'naming' },
              { keywords: ['gui', 'tab', 'dialog', 'tooltip', 'character screen', 'ui'], label: 'gui' },
              { keywords: ['api', 'public api', 'integration', 'compat'], label: 'api' },
              { keywords: ['craft', 'recipe', 'grid'], label: 'crafting' },
              { keywords: ['texture', 'shape', 'model', 'asset', 'lang'], label: 'assets' },
              { keywords: ['ci', 'workflow', 'build', 'csproj', 'dotnet'], label: 'chore' },
            ];

            for (const rule of rules) {
              if (rule.keywords.some(kw => text.includes(kw))) {
                labels.push(rule.label);
              }
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels,
              });
            }
